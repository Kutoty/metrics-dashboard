<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live metrics</title>
  <style>
    body { font-family: sans-serif; margin: 2rem auto; max-width: 40rem; color: #172033; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
    article { border: 1px solid #e6e8ee; border-radius: 12px; padding: 1rem; }
    strong { display: block; font-size: 1.8rem; }
    p { color: #667085; }
  </style>
</head>
<body>
  <h1>Live metrics</h1>
  <p>Counts update from a server event stream. Leave this tab open.</p>
  <div class="grid">
    <article><span>Requests</span><strong id="requests">0</strong></article>
    <article><span>Errors</span><strong id="errors">0</strong></article>
    <article><span>Latency</span><strong id="latency">0</strong></article>
  </div>
  <script>
    const source = new EventSource("/events");
    source.onmessage = (event) => {
      const sample = JSON.parse(event.data);
      document.querySelector("#requests").textContent = sample.requests;
      document.querySelector("#errors").textContent = sample.errors;
      document.querySelector("#latency").textContent = sample.latencyMs + " ms";
    };
  </script>
</body>
</html>
